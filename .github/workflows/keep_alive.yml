name: Keep Agrolinking Intelligence API Alive

on:
  schedule:
    - cron: '*/4 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway (primary)
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://agrolinking-intelligence-production.up.railway.app/health)
          echo "Railway response: $response"

      - name: Ping Render (backup)
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://agrolinking-intelligence.onrender.com/health)
          echo "Render response: $response"
