name: Web Price Stream

# Every 3 hours: a focused web price search (Claude API + web search) for the
# commodities without a fresh Agricome/WFP price, plus two others in turn.
# Each run uses a different search focus (exchange -> official trackers ->
# northern markets -> southern markets -> news), so over a day each commodity
# is looked up in several independent places. See
# pipeline/10_web_price_search.py --rotate.
#
# Writes ONLY to the web_price_estimates Postgres table - no git commits, so it
# can never collide with the daily pipeline. Results are vetted and promoted
# into the price data by step 00c of the daily run (14_promote_web_prices.py).

on:
  schedule:
    # 41 minutes past every third hour UTC (00:41, 03:41 ... 21:41). Was :30,
    # which GitHub often dropped at busy times - only ~4 of 8 runs happened
    # on 14 Oct 2026.
    - cron: "41 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: web-price-stream
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Only what the search needs - not the full forecasting stack.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "anthropic>=1.11.0" psycopg2-binary "pandas>=2.0.0" "numpy>=1.24.0" "loguru>=0.7.0" python-dateutil

      - name: Rotating web price search
        env:
          TSDB_URL: ${{ secrets.TSDB_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python pipeline/10_web_price_search.py --rotate
