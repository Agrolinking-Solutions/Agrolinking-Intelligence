name: Daily Agrolinking Pipeline

on:
  schedule:
    - cron: '0 6 * * *'   # 6am UTC = 7am WAT every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight dependencies only
        run: |
          pip install pandas numpy loguru

      - name: Run steps 7 and 8 only
        run: |
          # Steps 5+6 require trained model pkl files which are not in the repo
          # They run locally on John's machine (weekly retrain + daily forecast)
          # Steps 7+8 only need the validated JSON files which ARE in the repo
          python pipeline/07_zonal_forecast.py
          python pipeline/08_intelligence.py

      - name: Commit and push fresh outputs
        run: |
          git config user.name "Agrolinking Pipeline Bot"
          git config user.email "pipeline@agrolinking.com"
          git add outputs/forecasts/zonal/
          git add outputs/daily_alerts/
          git add outputs/intelligence/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto daily update $(date '+%Y-%m-%d') - zonal + intelligence"
            git push origin main
          fi
