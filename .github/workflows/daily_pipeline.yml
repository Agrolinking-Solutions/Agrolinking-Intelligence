name: Daily Forecast Pipeline

# Runs the full 01→10 pipeline every day, unattended, and commits the
# results back to the repo. This replaces manually running each step
# by hand — the anchor/validated-actual cycle only advances daily if
# something actually runs the pipeline every day; this is that "something".

on:
  schedule:
    # GitHub delays or drops scheduled runs at busy times, worst on the hour
    # and half hour: the 05:00 UTC slot ran 5 hours late on 14 Oct 2026 and
    # not at all on 15 Oct. So: off-peak minutes, plus a backup slot that
    # does nothing if the first one already ran (see the gate job).
    - cron: "17 4 * * *"    # 05:17 Lagos (WAT, UTC+1)
    - cron: "43 6 * * *"    # 07:43 Lagos - backup, skipped if today's run is done
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # required so the workflow can commit + push results

# A backup run that fires while the first is still going waits for it, then
# its gate sees today's commit and stops.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        run: |
          today=$(date -u +'%Y-%m-%d')
          if [ "${{ github.event_name }}" = "schedule" ] && git log -n 50 --format=%s | grep -q "Automated daily pipeline run - $today"; then
            echo "Today's daily run already committed - nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  run-pipeline:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180   # ARIMA order search + Prophet can be slow; generous ceiling

    # The TSDB_URL secret has no password in it, so every Postgres step was
    # failing with "fe_sendauth: no password supplied". libpq reads
    # PGPASSWORD from the environment whenever the connection URL doesn't
    # include one, so the password lives in its own secret (no URL-encoding
    # pitfalls with special characters). Empty if the secret isn't set,
    # which just reproduces the old behaviour.
    env:
      PGPASSWORD: ${{ secrets.PGPASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # pin to match whatever version pmdarima/prophet were built against locally

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Run the full pipeline in the correct order ──────────────────
      # Same sequence as the manual runs this session established:
      # 01 (ingest) → 02 (clean) → 03 (features) → 04 (train) →
      # 05 (forecast) → 06 (validate) → 07 (zonal) → 08 (intelligence).
      # 09 (staleness) and 10 (web price search) run after, both with
      # continue-on-error: true since neither should block publishing
      # today's otherwise-valid forecasts.
      # Each step's failure stops the run rather than silently
      # continuing on bad/partial data.
      # Live FX + weather into their own isolated files (never feeds the
      # forecast inputs). continue-on-error: a failed pull must not block
      # publishing today's forecasts. The two data files are committed
      # below so the daily history accumulates across ephemeral runners.
      - name: 00 - Live external factors
        continue-on-error: true
        run: python pipeline/11_external_factors.py

      # Web price search (formerly step 10). Writes only to the isolated
      # web_price_estimates Postgres table. Runs BEFORE ingest so the
      # promotion step below can use today's results. Skips cleanly (exit 0)
      # if ANTHROPIC_API_KEY isn't set.
      - name: 00b - Web price search
        continue-on-error: true
        env:
          TSDB_URL: ${{ secrets.TSDB_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python pipeline/10_web_price_search.py

      # Fills stale commodities: promotes web prices that pass the safety
      # checks (source named + dated, confidence >= medium, within a sanity
      # band of the last real price) into data/raw/web_prices.csv, which
      # ingest reads as a low-priority "Web_search" source. Only touches
      # commodities whose Agricome/WFP price is older than 10 days. Every
      # decision is logged to outputs/logs/web_price_promotion.json.
      - name: 00c - Promote web prices
        continue-on-error: true
        env:
          TSDB_URL: ${{ secrets.TSDB_URL }}
        run: python pipeline/14_promote_web_prices.py

      # Pulls the latest WFP Nigeria food prices from HDX (public, no key)
      # when HDX has a newer file. WFP has real monthly prices from ~20
      # markets for rice (local/imported), beans, meat, fish and eggs, and
      # had only been refreshed by hand. A download that is unreadable,
      # truncated or older than the current file is rejected and the current
      # file kept, so this can never break ingest.
      - name: 00d - Refresh WFP prices
        continue-on-error: true
        run: python pipeline/refresh_wfp_hdx.py

      # AFEX commodity-exchange prices for Nigeria (daily, dated), read from
      # Mansa Markets' public pages into data/raw/afex_prices.csv. Used by the
      # cross-check (09b). Never blocks the run.
      - name: 00e - AFEX exchange prices
        continue-on-error: true
        run: python pipeline/fetch_afex_prices.py

      # FEWS NET weekly wholesale prices (Kano, Ibadan, Kaura Namoda,
      # Maiduguri) and NBS retail averages, via FAO's price API, into
      # data/raw/fao_fpma_prices.csv. Stored for review; not yet used as real
      # prices. Never blocks the run.
      - name: 00f - FAO / FEWS NET market prices
        continue-on-error: true
        run: python pipeline/fetch_fao_prices.py

      - name: 01 - Ingest
        run: python pipeline/01_ingest.py

      - name: 02 - Clean
        run: python pipeline/02_clean.py

      - name: 03 - Features
        run: python pipeline/03_features.py

      # NOT changed to Monday-only despite run_pipeline.py's `today == 0`
      # intent for local runs — see docs/FIXES_AND_IMPROVEMENTS.md. GitHub
      # Actions runners are ephemeral (fresh VM every run, models/ is
      # gitignored and never committed), and there is no artifact caching
      # here to carry a Monday training run's model files forward to the
      # rest of the week. Skipping training on non-Mondays would leave
      # models/ completely empty on Tue-Sun, and forecast_commodity() in
      # 05_forecast.py skips any commodity where all 3 models return None
      # — meaning every commodity would produce zero forecast, every day
      # except Monday. Training daily is accidentally load-bearing until
      # real model persistence (e.g. actions/upload-artifact +
      # actions/download-artifact) is added across runs.
      - name: 04 - Train
        run: python pipeline/04_train.py

      # Re-scores every forecaster on REAL prices (rolling backtest, ~30s)
      # and writes outputs/backtest/model_selection.json, which 05 reads to
      # pick each commodity's champion. continue-on-error: if it fails, 05
      # simply skips the champion forecast for the day.
      - name: 04b - Accuracy scoring and champion selection
        continue-on-error: true
        run: python pipeline/13_select_forecaster.py

      # Champion forecaster live (was "shadow" from 2026-10-09): each
      # commodity's forecast comes from the method that scored best against
      # real prices in 13_select_forecaster.py, not the ARIMA/Prophet/XGBoost
      # ensemble, which scored ~77% vs ~93% and was showing moves like
      # -31% in a week for Beans (white). Set to "shadow" to go back.
      - name: 05 - Forecast
        env:
          FORECAST_CHAMPION_MODE: live
        run: python pipeline/05_forecast.py

      - name: 06 - Validate
        env:
          TSDB_URL: ${{ secrets.TSDB_URL }}
        run: python pipeline/06_validate.py

      # Scores every forecast published so far (outputs/forecasts/validated)
      # against the real price that later arrived for its target date, and
      # writes outputs/backtest/live_accuracy.json (served at /accuracy).
      # Read-only on the data; continue-on-error so it can't block publishing.
      - name: 06b - Live accuracy tracking
        continue-on-error: true
        run: python pipeline/15_track_accuracy.py

      # TSDB_URL was missing on these two steps — each step's env is
      # scoped to itself, not inherited from step 06, so the zonal and
      # intelligence dual-writes to Postgres have been silently failing
      # ("TSDB_URL not set") on every automated run since they were added.
      - name: 07 - Zonal forecast
        env:
          TSDB_URL: ${{ secrets.TSDB_URL }}
        run: python pipeline/07_zonal_forecast.py

      - name: 08 - Intelligence
        env:
          TSDB_URL: ${{ secrets.TSDB_URL }}
        run: python pipeline/08_intelligence.py

      # Existed in the repo but was never wired in here, so nothing has
      # been checking data freshness on the actual daily runs — only
      # whoever remembered to run it manually. Exits non-zero on ALERT/
      # NO_REAL_DATA, but continue-on-error keeps that from blocking the
      # commit below: a stale real-data source is a real problem to fix,
      # but it shouldn't stop today's otherwise-valid forecasts from
      # publishing. The failure still shows up in the Actions run log
      # (yellow "!" on this step) and in outputs/logs/staleness_alert.json.
      - name: 09 - Staleness check
        continue-on-error: true
        run: python pipeline/09_staleness_check.py

      # Compares each commodity's latest real price with the wholesale web
      # prices found in the last two weeks and flags disagreements (>30%)
      # for a person to check. Report only - never blocks publishing.
      # Output: outputs/logs/price_crosscheck.json, served at /crosscheck.
      - name: 09b - Price cross-check
        continue-on-error: true
        env:
          TSDB_URL: ${{ secrets.TSDB_URL }}
        run: python pipeline/16_cross_check.py

      # Plain-language summary of today's real data (gaps, web prices added
      # or rejected and why, cross-check flags) at the top of this run's page.
      - name: Real-data status
        if: always()
        continue-on-error: true
        run: python pipeline/data_status.py

      # (Step 10, the web price search, now runs at the start of the job as
      # 00b, so the same day's web prices can fill stale commodities.)

      # ── Refuse to publish bad data ──────────────────────────────────
      # Individual steps can "succeed" while writing NaN forecasts (e.g.
      # from a corrupted master CSV). NaN in the output JSON makes most
      # API endpoints return 500, so if the gate fails nothing below
      # runs — the API keeps serving yesterday's good files.
      - name: Quality gate
        run: python pipeline/quality_gate.py

      # ── Commit and push whatever changed ────────────────────────────
      - name: Commit and push results
        run: |
          git config user.name "agrolinking-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed/agrolinking_master.csv data/processed/features/ outputs/ data/external/live_fx.csv data/external/weather_daily.csv data/raw/web_prices.csv data/raw/wfp_food_prices_nga.csv data/raw/.wfp_hdx_state.json data/raw/afex_prices.csv data/raw/fao_fpma_prices.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated daily pipeline run - $(date -u +'%Y-%m-%d')"
            # Retry the push if main moved underneath us (e.g. a manual
            # local run pushed while this job was still training/
            # forecasting). These are fully regenerated data files, so
            # on a genuine conflict this run's freshly-generated output
            # is what should win — that's what -X ours means here.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt) — fetching and retrying..."
              git fetch origin main
              git merge -X ours origin/main -m "Merge remote changes (automated)"
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Push still failing after 3 attempts — giving up this run."
                exit 1
              fi
            done
          fi

      # ── Surface a failure clearly rather than a silent skipped day ──
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily pipeline run failed — Last Known date will not advance today. Check the failed step above."