name: Daily Forecast Pipeline

# Runs the full 01→08 pipeline every day, unattended, and commits the
# results back to the repo. This replaces manually running each step
# by hand — the anchor/validated-actual cycle only advances daily if
# something actually runs the pipeline every day; this is that "something".

on:
  schedule:
    # 05:00 UTC = 06:00 Lagos (WAT, UTC+1). Adjust if you want a
    # different time of day — GitHub's cron can be a few minutes late
    # during peak load, that's normal.
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # required so the workflow can commit + push results

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # ARIMA order search + Prophet can be slow; generous ceiling

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # pin to match whatever version pmdarima/prophet were built against locally

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Run the full pipeline in the correct order ──────────────────
      # Same sequence as the manual runs this session established:
      # 01 (ingest) → 02 (clean) → 03 (features) → 04 (train) →
      # 05 (forecast) → 06 (validate) → 07 (zonal) → 08 (intelligence).
      # Each step's failure stops the run rather than silently
      # continuing on bad/partial data.
      - name: 01 - Ingest
        run: python pipeline/01_ingest.py

      - name: 02 - Clean
        run: python pipeline/02_clean.py

      - name: 03 - Features
        run: python pipeline/03_features.py

      # NOT changed to Monday-only despite run_pipeline.py's `today == 0`
      # intent for local runs — see docs/FIXES_AND_IMPROVEMENTS.md. GitHub
      # Actions runners are ephemeral (fresh VM every run, models/ is
      # gitignored and never committed), and there is no artifact caching
      # here to carry a Monday training run's model files forward to the
      # rest of the week. Skipping training on non-Mondays would leave
      # models/ completely empty on Tue-Sun, and forecast_commodity() in
      # 05_forecast.py skips any commodity where all 3 models return None
      # — meaning every commodity would produce zero forecast, every day
      # except Monday. Training daily is accidentally load-bearing until
      # real model persistence (e.g. actions/upload-artifact +
      # actions/download-artifact) is added across runs.
      - name: 04 - Train
        run: python pipeline/04_train.py

      - name: 05 - Forecast
        run: python pipeline/05_forecast.py

      - name: 06 - Validate
        env:
          TSDB_URL: ${{ secrets.TSDB_URL }}
        run: python pipeline/06_validate.py

      # TSDB_URL was missing on these two steps — each step's env is
      # scoped to itself, not inherited from step 06, so the zonal and
      # intelligence dual-writes to Postgres have been silently failing
      # ("TSDB_URL not set") on every automated run since they were added.
      - name: 07 - Zonal forecast
        env:
          TSDB_URL: ${{ secrets.TSDB_URL }}
        run: python pipeline/07_zonal_forecast.py

      - name: 08 - Intelligence
        env:
          TSDB_URL: ${{ secrets.TSDB_URL }}
        run: python pipeline/08_intelligence.py

      # ── Refuse to publish bad data ──────────────────────────────────
      # Individual steps can "succeed" while writing NaN forecasts (e.g.
      # from a corrupted master CSV). NaN in the output JSON makes most
      # API endpoints return 500, so if the gate fails nothing below
      # runs — the API keeps serving yesterday's good files.
      - name: Quality gate
        run: python pipeline/quality_gate.py

      # ── Commit and push whatever changed ────────────────────────────
      - name: Commit and push results
        run: |
          git config user.name "agrolinking-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed/agrolinking_master.csv data/processed/features/ outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated daily pipeline run - $(date -u +'%Y-%m-%d')"
            # Retry the push if main moved underneath us (e.g. a manual
            # local run pushed while this job was still training/
            # forecasting). These are fully regenerated data files, so
            # on a genuine conflict this run's freshly-generated output
            # is what should win — that's what -X ours means here.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt) — fetching and retrying..."
              git fetch origin main
              git merge -X ours origin/main -m "Merge remote changes (automated)"
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Push still failing after 3 attempts — giving up this run."
                exit 1
              fi
            done
          fi

      # ── Surface a failure clearly rather than a silent skipped day ──
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily pipeline run failed — Last Known date will not advance today. Check the failed step above."